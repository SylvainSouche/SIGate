[project]
name = "sigate"
# Not kept in automatic sync with metadata.txt's own version - nothing
# in this project's actual tooling (the Makefile, ruff, pytest) reads
# this field at all; metadata.txt's version is the sole authoritative
# one (see make increment). Updated here periodically so it doesn't
# drift too far, but treat it as approximate, not load-bearing.
version = "0.0.66"
description = "QGIS plugin: browse and download geospatial data from national mapping agencies via QGIS's Data Source Manager."
requires-python = ">=3.9"

[tool.ruff]
target-version = "py39"
exclude = [
    "sigate/i18n",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
]

[tool.ruff.lint]
# Deliberately left at ruff's own real bare default (E4, E7, E9, F) -
# confirmed by comparing `ruff check` with and without this file present
# on the actual codebase before committing to it, not assumed. The wider
# "E" category (which this project's code has never actually been held
# to) additionally turns on E501 line-length, which this codebase is not
# currently clean against - mostly long section-divider comments and a
# handful of long user-facing message strings. Widening the rule set is a
# real, separate decision with its own cleanup pass, not something to
# take on as a side effect of just writing this file down.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["sigate/tests"]
